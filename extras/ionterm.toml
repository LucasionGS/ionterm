# ionterm configuration. Copy to ~/.config/ionterm/ionterm.toml (Linux) or
# %APPDATA%\ionterm\ionterm.toml (Windows). Every key is optional; the values
# below are the defaults. Changes apply live.
#
# Colours live in theme.toml next to this file, which the Ionix styler manages.

[font]
family = "JetBrainsMono Nerd Font"   # empty = system monospace
size = 11.0                          # points
ligatures = true

[window]
padding = 8                          # logical pixels around the grid
decorations = "auto"                 # auto | none | full (auto = none on Hyprland)
# opacity = 0.92                     # overrides the theme's background_opacity
columns = 100                        # initial size, if the compositor allows it
lines = 30

[terminal]
scrollback_lines = 10000
shell = ""                           # empty = your login shell
term = "auto"                        # auto = xterm-ionterm if installed, else xterm-256color
wheel_scroll_lines = 3
advertise_sixel = false              # sixel always displays; announcing it makes yazi pick sixel over kitty graphics
shell_integration = true             # mark prompts in bash/zsh/fish 3 (fish 4 does it itself): prompt jumps, output selection, failed marks

[tab_bar]
style = "tabs"                       # tabs (Windows Terminal style) | slanted | angled | round (kitty Powerline)
edge = "top"                         # top | bottom
show = "auto"                        # auto (2+ tabs) | always | never
max_title_length = 30                # Powerline styles only

[layouts]
enabled = ["splits", "tall", "fat", "grid", "stack"]   # next_layout cycles these; the first is the default
border_width = 2                     # logical pixels between panes

[files]
panel_width = 46                     # columns, at most half the window
download_dir = ""                    # empty = the system's Downloads folder
show_hidden = false                  # dotfiles in the SSH file panel (ctrl+h toggles)

[cursor]
shape = "beam"                       # block | beam | underline
blink_interval = 0.5                 # seconds, 0 = no blinking

[keybindings]
# Merged over the defaults; set an action to "none" to unbind a default.
#
# Tabs
# "ctrl+shift+t" = "new_tab"
# "ctrl+shift+q" = "close_tab"
# "ctrl+shift+right" = "next_tab"            (also ctrl+tab)
# "ctrl+shift+left" = "previous_tab"         (also ctrl+shift+tab)
# "ctrl+shift+period" = "move_tab_forward"
# "ctrl+shift+comma" = "move_tab_backward"
# "ctrl+shift+alt+t" = "rename_tab"
# "alt+1" = "goto_tab 1"                     (alt+1 … alt+9)
#
# Panes
# "ctrl+shift+enter" = "new_split"           (splits along the longer side)
# "ctrl+shift+w" = "close_pane"
# "ctrl+shift+right_bracket" = "next_pane"
# "ctrl+shift+left_bracket" = "previous_pane"
# "ctrl+shift+f" = "move_pane_forward"
# "ctrl+shift+b" = "move_pane_backward"
# "ctrl+shift+l" = "next_layout"
# Unbound by default: split_right, split_down, focus_left/right/up/down,
# resize_wider/narrower/taller/shorter, toggle_zoom
#
# Everything else
# "ctrl+shift+c" = "copy"
# "ctrl+shift+v" = "paste"
# "shift+insert" = "paste_selection"
# "ctrl+shift+up" = "scroll_line_up"
# "ctrl+shift+down" = "scroll_line_down"
# "shift+page_up" = "scroll_page_up"
# "shift+page_down" = "scroll_page_down"
# "ctrl+shift+home" = "scroll_home"
# "ctrl+shift+end" = "scroll_end"
#
# Shell integration
# "ctrl+shift+z" = "previous_prompt"
# "ctrl+shift+x" = "next_prompt"
# "ctrl+shift+g" = "copy_last_command_output"
# "ctrl+shift+equal" = "increase_font_size"
# "ctrl+shift+minus" = "decrease_font_size"
# "ctrl+shift+backspace" = "reset_font_size"
# "ctrl+shift+f5" = "reload_config"
