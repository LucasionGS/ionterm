name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_x64
            binary: ionterm
          - os: windows-latest
            platform: windows_x64
            binary: ionterm.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v5
        with:
          name: ionterm-${{ matrix.platform }}
          path: target/release/${{ matrix.binary }}
          # Every push uploads a build; keep them briefly so they don't fill the account's storage.
          retention-days: 7
