[package]
name = "ionterm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
dirs = "7.0.0"
# Background images (png is already in the tree through arboard).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
ionterm-render = { version = "0.1.0", path = "../ionterm-render" }
ionterm-vt = { version = "0.1.0", path = "../ionterm-vt" }
notify = "8.2.0"
png = "0.18.1"
pollster = "1.0.1"
portable-pty = "0.9.0"
regex = { version = "1.12.2", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
tar = { version = "0.4.46", default-features = false }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
winit = "0.30.13"

# File drops on Wayland, which winit 0.30 doesn't report (see dnd.rs).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["event", "process"] }
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"

[build-dependencies]
embed-resource = "3.0.12"
